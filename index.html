<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>WORLDFALL</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":16,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":290301612,"index.wasm":38106390},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = true;
const __args=new URLSearchParams(location.search).get("args"); if(__args) GODOT_CONFIG.args=__args.split(",");
const engine = new Engine(GODOT_CONFIG);
const HOSTED_PACK = {"parts": ["index.pck.gz.000", "index.pck.gz.001", "index.pck.gz.002", "index.pck.gz.003"], "size": 290301612, "compressed": 143764041};
// Fetch the gzip parts of the pack in parallel, inflate them in order and
// start the engine with the pack preloaded (replaces Engine.startGame()).
function startHostedGame(options) {
	const exe = GODOT_CONFIG.executable;
	const pack = exe + '.pck';
	const wasmSize = GODOT_CONFIG.fileSizes[exe + '.wasm'];
	const total = wasmSize + HOSTED_PACK.compressed;
	let wasmLoaded = 0;
	let packLoaded = 0;
	const report = () => options.onProgress(Math.min(wasmLoaded, wasmSize) + packLoaded, total);
	engine.config.update({ onProgress: (current) => { wasmLoaded = current; report(); } });
	async function loadPack() {
		const inflate = new DecompressionStream('gzip');
		const writer = inflate.writable.getWriter();
		const data = new Uint8Array(HOSTED_PACK.size);
		let offset = 0;
		const reading = (async () => {
			const reader = inflate.readable.getReader();
			for (;;) {
				const { done, value } = await reader.read();
				if (done) return;
				if (offset + value.length > data.length) throw new Error('Game data is larger than expected');
				data.set(value, offset);
				offset += value.length;
			}
		})();
		// Each part downloads whole (retried up to four times) before it is
		// inflated, so a dropped connection costs one part, not the game.
		const partLoaded = HOSTED_PACK.parts.map(() => 0);
		async function download(name, index) {
			for (let attempt = 1; ; attempt++) {
				try {
					const response = await fetch(name, attempt > 1 ? { cache: 'reload' } : {});
					if (!response.ok) throw new Error('HTTP ' + response.status);
					const reader = response.body.getReader();
					const chunks = [];
					for (;;) {
						const { done, value } = await reader.read();
						if (done) break;
						chunks.push(value);
						packLoaded += value.length;
						partLoaded[index] += value.length;
						report();
					}
					return chunks;
				} catch (error) {
					packLoaded -= partLoaded[index];
					partLoaded[index] = 0;
					report();
					console.warn('Download of ' + name + ' failed (attempt ' + attempt + '):', error);
					if (attempt >= 4) throw new Error('Could not download ' + name + ': ' + error.message);
					await new Promise((resolve) => setTimeout(resolve, 1000 * attempt));
				}
			}
		}
		const parts = HOSTED_PACK.parts.map(download);
		for (const part of parts) {
			for (const chunk of await part) await writer.write(chunk);
		}
		await writer.close();
		await reading;
		if (offset !== data.length) throw new Error('Game data is incomplete');
		return data;
	}
	return Promise.all([engine.init(exe), loadPack()])
		// Pass the ArrayBuffer: preloadFile() looks the argument up in
		// fileSizes, which turns a typed array into one huge string.
		.then(([, data]) => engine.preloadFile(data.buffer, pack))
		.then(() => engine.start({ args: ['--main-pack', pack].concat(GODOT_CONFIG.args) }));
}

(function () {
	if (!window.crossOriginIsolated && 'serviceWorker' in navigator && !sessionStorage.getItem('worldfall-coi')) {
		sessionStorage.setItem('worldfall-coi', '1');
		navigator.serviceWorker.register('coi-sw.js').then(() => navigator.serviceWorker.ready).then(() => window.location.reload());
		return;
	}
	sessionStorage.removeItem('worldfall-coi');
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		startHostedGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
